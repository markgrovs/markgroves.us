[context.production.environment]
  HUGO_VERSION = "0.166.0"

[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL --buildFuture "
  [context.deploy-preview.environment]
    HUGO_VERSION = "0.166.0"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL --buildFuture --buildDrafts"
  [context.branch-deploy.environment]
    HUGO_VERSION = "0.166.0"

[[redirects]]
  from = "/log/*"
  to = "/logs/:splat"
  status = 301

[[redirects]]
  from = "/.well-known/host-meta*"
  to = "https://fed.brid.gy/.well-known/host-meta:splat"
  status = 302
  force = true

[[redirects]]
  from = "/.well-known/webfinger*"
  to = "https://fed.brid.gy/.well-known/webfinger"
  status = 302
  force = true

[[headers]]
for = "/*"
[headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"