title = "Mark Groves"
theme = "hello-friend-ng"
baseUrl = "https://markgroves.us"
languageCode = "en-us"
enableGitInfo = true

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true



[permalinks]
  posts = "/:year/:month/:day/:title/"
  links = "/:year/:month/:day/:title/"
[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"
  gitUrl = "https://github.com/markgrovs/markgroves.us/commit/"
  webmentionTestUrl = true
  webmentions = true
  # Metadata mostly used in document's head
  description = "Homepage and blog by Mark Groves"
  keywords = "homepage, blog"
  images = [""]

  # Enable theme toggle
  # 
  # This options enables the theme toggle for the theme. 
  # Per default, this option is off. 
  # The theme is respecting the prefers-color-scheme of the operating system. 
  # With this option on, the page user is able to set the scheme he wants. 
  enableThemeToggle = true

  [params.footer]
    trademark = 2024
    rss = true
    copyright = true
    author = true

    topText = []
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Made with &#10084; by <a href=\"https://github.com/rhazdon\">Djordje Atlialp</a>"
    ]



  # Directory name of your blog content (default is `content/posts`)
  contentTypeName = "posts"
  # Default theme "light" or "dark"
  defaultTheme = "dark"
    # Social icons
  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/markgrovs"

  [[params.social]]
    name = "email"
    url  = "mailto:mark@markgroves.us"

  [[params.social]]
    name = "github"
    url  = "https://github.com/markgrovs"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/in/mark-groves/"
  [[params.social]]
    name = "mastodon"
    url = "https://masto.ai/@markgroves"
    rel = "me"
  [[author]]
    name = 'Mark Groves'
  
[outputs]
home = ["html", "rss"]
section = ["html", "rss"]

[languages]
  [languages.en]
    title = "Mark Groves"
    subtitle = "homepage and blog"
    homeSubtitle = "software professional, but mostly still figuring it out."
    keywords = ""
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "/home/markgroves"
      logoHomeLink = "/"
    # or
    #
    # path = "/img/your-example-logo.svg"
    # alt = "Your example logo alt text"

# And you can even create generic menu
[menu]
  [[menu.main]]
    identifier = "archive"
    name       = "archive"
    url        = "posts/" 
  [[menu.main]]
    identifier = "/now"
    name       = "/now"
    url        = "now/"

[module]
[[module.mounts]]
source = 'content'
target = 'content'
excludeFiles = ['templates/**']

