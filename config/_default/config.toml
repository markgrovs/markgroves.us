title = "Mark Groves"
theme = "commonplace"
baseUrl = "https://markgroves.us"
languageCode = "en-us"
enableGitInfo = true
enableRobotsTXT = false
layoutDir = "commonplace-overrides"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true



[permalinks]
  posts = "/:year/:month/:day/:title/"
  links = "/:year/:month/:day/:title/"
[params]
  # Production subscriptions stay on this origin when previews override baseURL.
  productionBaseURL = "https://markgroves.us"
  welcome = "A public notebook by Mark Groves. Recent notes and longer essays live here."
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04 -0700"
  gitUrl = "https://github.com/markgrovs/markgroves.us/commit/"
  webmentionTestUrl = true
  webmentions = true
  # Metadata mostly used in document's head
  description = "Personal site of Mark Groves — retired software industry leader, formerly at DocuSign, SAP Concur, Microsoft, and Splunk. Based in Pagosa Springs, CO."
  keywords = "Mark Groves, software engineering, product management, DocuSign, SAP Concur, Microsoft, Splunk, Pagosa Springs, retired, engineering leadership"
  images = [""]

  [[params.social]]
    name = "email"
    url  = "mailto:mark@markgroves.us"

 [[params.social]]
    name = "rss"
    url = "https://markgroves.us/index.xml"

  [params.author]
    first_name = "Mark"
    last_name = "Groves"
    full_name = "Mark Groves"
    name = "Mark Groves" # Compatibility alias; Commonplace uses full_name.

  [params.indieweb]
    authorization_endpoint = "https://indieauth.com/auth"
    token_endpoint = "https://tokens.indieauth.com/token"
    webmention_endpoint = "https://webmention.io/markgroves.us/webmention"
    pingback_endpoint = "https://webmention.io/markgroves.us/xmlrpc"

[outputs]
home = ["html", "rss"]
section = ["html", "rss"]

[languages]
  [languages.en]
    title = "Mark Groves"
    subtitle = "homepage and blog"
    homeSubtitle = "software professional, but mostly still figuring it out."
    keywords = ""
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "/home/markgroves"
      logoHomeLink = "/"
    # or
    #
    # path = "/img/your-example-logo.svg"
    # alt = "Your example logo alt text"

# And you can even create generic menu
[menu]
  [[menu.main]]
    identifier = "archive"
    name       = "archive"
    url        = "posts/" 
  [[menu.main]]
    identifier = "/now"
    name       = "/now"
    url        = "now/"
  [[menu.main]]
    identifier = "cv"
    name       = "cv"
    url        = "cv/"

[module]
[[module.mounts]]
source = 'content'
target = 'content'
files = ['! templates/**']
